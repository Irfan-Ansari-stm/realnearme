version: '3.9'

services:
  # ── PostgreSQL with PostGIS ──────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    container_name: nearme_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nearme
      POSTGRES_USER: nearme_app
      POSTGRES_PASSWORD: change_me_in_production
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../2. db/nearme_postgresql_v1_0.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nearme_app -d nearme']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nearme_net

  # ── Express.js API ───────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: nearme_api
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: nearme
      DB_USER: nearme_app
      DB_PASSWORD: change_me_in_production
      DB_POOL_MIN: 2
      DB_POOL_MAX: 20
      DB_SSL: 'false'
      JWT_SECRET: dev_jwt_secret_replace_in_production
      JWT_EXPIRES_IN: 1h
      JWT_REFRESH_SECRET: dev_refresh_secret_replace_in_production
      JWT_REFRESH_EXPIRES_IN: 60d
      LOG_LEVEL: info
      API_PREFIX: /api/v1
      ALLOWED_ORIGINS: 'http://localhost:3000,http://localhost:19006'
      FEED_MAX_RESULTS: '50'
      FEED_CACHE_TTL_HOURS: '24'
      PLACE_DETAIL_CACHE_TTL_HOURS: '6'
      SEARCH_HISTORY_MAX: '10'
      CRON_ENABLED: 'true'
      BCRYPT_SALT_ROUNDS: '12'
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nearme_net
    command: npm run dev

  # ── Production variant (override with docker-compose.prod.yml) ──
  # api_prod:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #     target: production
  #   ...

volumes:
  postgres_data:
    driver: local

networks:
  nearme_net:
    driver: bridge
