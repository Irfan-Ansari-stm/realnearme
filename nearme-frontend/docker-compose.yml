version: '3.9'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: nearme_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nearme
      POSTGRES_USER: nearme_app
      POSTGRES_PASSWORD: change_me_in_production
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nearme_app -d nearme']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nearme_net

  api:
    build:
      context: ../nearme-backend
      dockerfile: Dockerfile
      target: development
    container_name: nearme_api
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: nearme
      DB_USER: nearme_app
      DB_PASSWORD: change_me_in_production
      JWT_SECRET: dev_jwt_secret_replace_in_production_32chars
      JWT_REFRESH_SECRET: dev_refresh_secret_replace_32chars
      LOG_LEVEL: info
      API_PREFIX: /api/v1
      CRON_ENABLED: 'true'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nearme_net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nearme_frontend
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000/api/v1
      NEXT_PUBLIC_APP_NAME: NearMe
    depends_on:
      - api
    networks:
      - nearme_net

volumes:
  postgres_data:

networks:
  nearme_net:
    driver: bridge
